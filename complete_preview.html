<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>완전체 카드 프리뷰</title>
<link href="https://fonts.googleapis.com/css2?family=Gamja+Flower&family=Poor+Story&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    min-height: 100vh;
    display: flex; align-items: center; justify-content: center;
    background: rgba(0,0,0,0.75);
    font-family: 'Noto Sans KR', sans-serif;
  }

  .group-photo-frame {
    background: linear-gradient(145deg, #f0f7f0, #f5faf5, #eef6ee);
    border: 4px solid #2d5a2d;
    border-radius: 24px;
    padding: 24px 20px 20px;
    max-width: 520px; width: 94%;
    text-align: center;
    box-shadow:
      0 0 60px rgba(100,200,120,0.3),
      0 0 120px rgba(80,180,100,0.15),
      6px 6px 0 #1a3a1a;
    animation: photoAppear 0.8s ease-out;
    position: relative; overflow: hidden;
  }
  .group-photo-frame::before {
    content: ''; position: absolute; inset: 0;
    background: repeating-linear-gradient(45deg, transparent 0 10px, rgba(100,200,120,0.03) 10px 11px);
    pointer-events: none;
  }
  @keyframes photoAppear {
    0% { transform: scale(0.5) rotate(-3deg); opacity: 0; filter: brightness(2); }
    60% { transform: scale(1.03) rotate(1deg); filter: brightness(1.2); }
    100% { transform: scale(1) rotate(0); opacity: 1; filter: brightness(1); }
  }

  .group-photo-header {
    font-size: 22px; font-weight: 900; color: #2d6a2d;
    text-shadow: 0 1px 0 rgba(255,255,255,0.5);
    margin-bottom: 14px;
    position: relative; z-index: 2;
  }
  .group-photo-header small {
    display: block; font-size: 12px; color: #7a9a7a;
    font-weight: 600; margin-top: 2px;
  }

  .group-photo-stage {
    position: relative;
    border-radius: 16px;
    border: 3px solid #2d5a2d;
    overflow: hidden;
    background: #111;
  }
  .complete-card-img {
    width: 100%; display: block;
    animation: cardImgReveal 1.5s ease-out;
  }
  @keyframes cardImgReveal {
    0% { filter: brightness(3) blur(15px) saturate(0); opacity: 0; transform: scale(1.1); }
    30% { filter: brightness(1.8) blur(6px) saturate(0.5); opacity: 1; }
    60% { filter: brightness(1.2) blur(2px) saturate(0.9); }
    100% { filter: brightness(1) blur(0) saturate(1); transform: scale(1); }
  }

  /* ====== 프리렌 마법 효과 ====== */

  /* 프리렌 마법진 — SVG로 그린 원형 룬 */
  .frieren-circle {
    position: absolute; pointer-events: none;
    border-radius: 50%;
    animation: frierenSpin 12s linear infinite;
  }
  .frieren-circle .ring {
    position: absolute; inset: 0;
    border: 1.5px solid rgba(100,220,140,0.35);
    border-radius: 50%;
  }
  .frieren-circle .ring.inner {
    inset: 15%; border-style: dashed;
    border-color: rgba(100,220,140,0.2);
    animation: frierenSpin 8s linear infinite reverse;
  }
  .frieren-circle .ring.core {
    inset: 35%;
    border-color: rgba(140,255,170,0.4);
    box-shadow: 0 0 15px rgba(100,220,140,0.2);
  }
  /* 룬 마크 */
  .frieren-circle .rune {
    position: absolute; font-size: 10px;
    color: rgba(100,220,140,0.6);
    filter: drop-shadow(0 0 3px rgba(100,220,140,0.5));
    animation: runePulse 2.5s ease-in-out infinite;
  }
  @keyframes frierenSpin { 100% { transform: rotate(360deg); } }
  @keyframes runePulse {
    0%,100% { opacity: 0.4; } 50% { opacity: 1; }
  }

  /* 프리렌 빛의 입자 — 부드럽게 떠오르는 초록빛 */
  .f-particle {
    position: absolute; border-radius: 50%; pointer-events: none;
    background: radial-gradient(circle, rgba(130,230,160,0.9) 0%, rgba(100,200,130,0.4) 50%, transparent 70%);
    box-shadow: 0 0 8px rgba(100,220,140,0.5);
    animation: fParticleFloat 5s ease-in-out infinite;
  }
  @keyframes fParticleFloat {
    0% { transform: translateY(0) scale(0.3); opacity: 0; }
    15% { opacity: 0.9; transform: scale(1); }
    70% { opacity: 0.6; }
    100% { transform: translateY(-100px) translateX(20px) scale(0.1); opacity: 0; }
  }

  /* 꽃잎 (프리렌의 꽃밭 마법) */
  .f-petal {
    position: absolute; pointer-events: none;
    width: 12px; height: 8px;
    background: radial-gradient(ellipse, rgba(255,200,210,0.8) 0%, rgba(255,170,190,0.5) 60%, transparent 100%);
    border-radius: 50% 0 50% 0;
    animation: petalDrift 6s ease-in-out infinite;
    filter: drop-shadow(0 0 2px rgba(255,180,200,0.4));
  }
  .f-petal.white {
    background: radial-gradient(ellipse, rgba(255,255,255,0.8) 0%, rgba(220,255,230,0.4) 60%, transparent 100%);
    filter: drop-shadow(0 0 2px rgba(200,255,220,0.4));
  }
  @keyframes petalDrift {
    0% { transform: translateY(-10px) translateX(0) rotate(0) scale(0); opacity: 0; }
    10% { opacity: 0.8; transform: scale(1) rotate(30deg); }
    50% { transform: translateY(40px) translateX(25px) rotate(180deg); opacity: 0.7; }
    100% { transform: translateY(120px) translateX(-15px) rotate(360deg) scale(0.3); opacity: 0; }
  }

  /* 전체 은은한 초록빛 글로우 */
  .frieren-glow {
    position: absolute; inset: 0; pointer-events: none;
    background: radial-gradient(ellipse at 50% 70%,
      rgba(100,220,140,0.12) 0%, rgba(80,200,120,0.04) 40%, transparent 65%);
    animation: frierenPulse 4s ease-in-out infinite;
  }
  .frieren-glow::after {
    content: ''; position: absolute; inset: 0;
    background: radial-gradient(ellipse at 30% 20%,
      rgba(180,255,200,0.08) 0%, transparent 40%);
  }
  @keyframes frierenPulse {
    0%,100% { opacity: 0.6; }
    50% { opacity: 1; }
  }

  /* 하단 정보 */
  .group-photo-caption {
    margin-top: 14px; font-size: 14px; font-weight: 700;
    color: #5a8a5a; position: relative; z-index: 2;
  }
  .group-photo-title {
    font-size: 20px; font-weight: 900; color: #2d5a2d;
    margin-top: 10px; position: relative; z-index: 2;
    letter-spacing: 2px;
    text-shadow: 0 0 20px rgba(100,220,140,0.3);
  }
  .gp-placard {
    margin: 16px auto 0; padding: 14px 24px;
    background: linear-gradient(135deg, #f5fff5, #fffff0);
    border: 2.5px dashed #5a9a5a; border-radius: 8px;
    font-family: 'Gamja Flower', 'Poor Story', cursive, sans-serif;
    font-size: 24px; font-weight: 400; color: #333;
    box-shadow: 3px 3px 0 rgba(0,80,0,0.08);
    position: relative; z-index: 2;
    animation: placardBounce 0.8s ease-out 1.8s backwards;
    line-height: 1.6;
    transform: rotate(-1deg);
    max-width: 90%;
  }
  .gp-placard .placard-name {
    color: #c92a6a; font-size: 28px; font-weight: 700;
  }
  .gp-placard::before {
    content: ''; position: absolute; top: -6px; left: 45%;
    width: 40px; height: 12px; background: rgba(100,200,120,0.5);
    border-radius: 2px; transform: rotate(-3deg);
  }
  @keyframes placardBounce {
    0% { transform: scale(0) rotate(-10deg); opacity: 0; }
    50% { transform: scale(1.08) rotate(1deg); }
    100% { transform: scale(1) rotate(-1deg); opacity: 1; }
  }
</style>
</head>
<body>

<div class="group-photo-frame">
  <div class="group-photo-header">
    ✦ 완전체 달성! ✦
    <small>장송의 프리렌 월드 · 전원 집합</small>
  </div>

  <div class="group-photo-stage" id="stage">
    <img class="complete-card-img" src="장송의프리렌/ -21 복사본.jpg" alt="프리렌 완전체">
    <div class="frieren-glow"></div>
    <div id="particles"></div>
    <div id="petals"></div>
    <div id="circles"></div>
  </div>

  <div class="group-photo-caption">8명의 캐릭터를 모두 모았어요!</div>
  <div class="group-photo-title">— 장송의 프리렌 COMPLETE —</div>
  <div class="gp-placard">
    <span class="placard-name">시윤짱!!</span> 여기까지오다니 스고이 !!
  </div>
</div>

<script>
// === 프리렌 마법진 생성 ===
const circlesEl = document.getElementById('circles');
const runes = ['◇','△','○','☆','◈','▽','✦','⬡','⬢','✧'];
function makeCircle(size, x, y, fromBottom) {
  const div = document.createElement('div');
  div.className = 'frieren-circle';
  div.style.width = div.style.height = size + 'px';
  div.style[fromBottom ? 'bottom' : 'top'] = y;
  div.style.left = x;
  // 3중 링
  div.innerHTML = `
    <div class="ring"></div>
    <div class="ring inner"></div>
    <div class="ring core"></div>
    ${[0,60,120,180,240,300].map(deg => {
      const r = runes[Math.floor(Math.random() * runes.length)];
      const rad = deg * Math.PI / 180;
      const rx = 50 + 45 * Math.cos(rad);
      const ry = 50 + 45 * Math.sin(rad);
      const d = (Math.random() * 2).toFixed(1);
      return `<span class="rune" style="left:${rx}%;top:${ry}%;animation-delay:${d}s">${r}</span>`;
    }).join('')}
  `;
  div.style.animationDuration = (10 + Math.random() * 8) + 's';
  return div;
}
circlesEl.appendChild(makeCircle(140, '2%', '5%', true));
circlesEl.appendChild(makeCircle(100, '65%', '5%', false));
circlesEl.appendChild(makeCircle(70, '75%', '15%', true));

// === 빛의 입자 생성 ===
const particlesEl = document.getElementById('particles');
let pHTML = '';
for (let i = 0; i < 20; i++) {
  const x = 3 + Math.random() * 94;
  const y = 10 + Math.random() * 85;
  const d = (Math.random() * 4).toFixed(1);
  const dur = (4 + Math.random() * 4).toFixed(1);
  const sz = 4 + Math.floor(Math.random() * 7);
  pHTML += `<div class="f-particle" style="left:${x}%;top:${y}%;width:${sz}px;height:${sz}px;animation-delay:${d}s;animation-duration:${dur}s"></div>`;
}
particlesEl.innerHTML = pHTML;

// === 꽃잎 생성 (프리렌 꽃밭 마법) ===
const petalsEl = document.getElementById('petals');
let petalHTML = '';
for (let i = 0; i < 12; i++) {
  const x = Math.random() * 100;
  const y = Math.random() * 40;
  const d = (Math.random() * 5).toFixed(1);
  const dur = (5 + Math.random() * 4).toFixed(1);
  const w = 8 + Math.floor(Math.random() * 10);
  const h = Math.floor(w * 0.6);
  const rot = Math.floor(Math.random() * 360);
  const white = i % 3 === 0 ? ' white' : '';
  petalHTML += `<div class="f-petal${white}" style="left:${x}%;top:${y}%;width:${w}px;height:${h}px;animation-delay:${d}s;animation-duration:${dur}s;transform:rotate(${rot}deg)"></div>`;
}
petalsEl.innerHTML = petalHTML;

// === 카드 사운드 (프리렌 OST 풍 — 하프+벨+패드) ===
document.addEventListener('click', function playOnce() {
  document.removeEventListener('click', playOnce);
  try {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const now = ctx.currentTime;
    // 하프 아르페지오 (C E G C E G — 맑고 투명하게)
    [523.25, 659.25, 783.99, 1046.5, 1318.5, 1568.0].forEach((freq, i) => {
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = 'sine';
      osc.frequency.value = freq;
      gain.gain.setValueAtTime(0, now + i * 0.13);
      gain.gain.linearRampToValueAtTime(0.12, now + i * 0.13 + 0.04);
      gain.gain.exponentialRampToValueAtTime(0.001, now + i * 0.13 + 1.5);
      osc.connect(gain).connect(ctx.destination);
      osc.start(now + i * 0.13);
      osc.stop(now + i * 0.13 + 2);
    });
    // 높은 벨 톤
    [2093, 2637, 3136].forEach((freq, i) => {
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = 'triangle';
      osc.frequency.value = freq;
      gain.gain.setValueAtTime(0, now + 0.9 + i * 0.18);
      gain.gain.linearRampToValueAtTime(0.06, now + 0.95 + i * 0.18);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 2.5 + i * 0.18);
      osc.connect(gain).connect(ctx.destination);
      osc.start(now + 0.9 + i * 0.18);
      osc.stop(now + 3 + i * 0.18);
    });
    // 따뜻한 패드
    [261.63, 329.63, 392.0].forEach(freq => {
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = 'sine';
      osc.frequency.value = freq;
      gain.gain.setValueAtTime(0, now);
      gain.gain.linearRampToValueAtTime(0.04, now + 0.8);
      gain.gain.linearRampToValueAtTime(0.03, now + 2.5);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 4);
      osc.connect(gain).connect(ctx.destination);
      osc.start(now);
      osc.stop(now + 4.5);
    });
  } catch(e) {}
}, { once: true });
</script>
</body>
</html>
